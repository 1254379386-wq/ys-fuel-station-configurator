  &lt;script&gt;
  (()=&gt;{
    const root=document.getElementById(&#x27;ys-fuel-config&#x27;);
    const $=id=&gt;root.querySelector(&#x27;#&#x27;+id);
    const esc=v=&gt;String(v).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
    const families={small:{name:&#x27;小型&#x27;,en:&#x27;Small&#x27;,caps:[3,5,6,7]},medium:{name:&#x27;中型&#x27;,en:&#x27;Medium&#x27;,caps:[10,15,20,30,40]},large:{name:&#x27;大型&#x27;,en:&#x27;Large&#x27;,caps:[50,60,70,80]},container:{name:&#x27;集装箱型&#x27;,en:&#x27;Containerized&#x27;,caps:[30,48]}};
    const planColors=[&#x27;#a9d3f3&#x27;,&#x27;#f7c47e&#x27;,&#x27;#c3b0e7&#x27;];
    function planLegend(lang=&#x27;cn&#x27;){return state.parts.map((p,i)=&gt;`&lt;span&gt;&lt;i class=&quot;fs-swatch&quot; style=&quot;background:${planColors[i]}&quot;&gt;&lt;/i&gt;${esc(compartmentName(i,lang))}&lt;/span&gt;`).join(&#x27;&#x27;)}
    const fuelNames={diesel:&#x27;柴油&#x27;,petrol:&#x27;汽油&#x27;,mixed:&#x27;汽油 + 柴油&#x27;},fuelEN={diesel:&#x27;Diesel&#x27;,petrol:&#x27;Gasoline&#x27;,mixed:&#x27;Gasoline + Diesel&#x27;};
    const russianLabels={&quot;Fuel Station Configuration&quot;: &quot;Комплектация мобильной АЗС&quot;, &quot;EQUIPMENT SELECTION / PRELIMINARY&quot;: &quot;ПОДБОР ОБОРУДОВАНИЯ / ПРЕДВАРИТЕЛЬНО&quot;, &quot;ENGLISH&quot;: &quot;РУССКИЙ&quot;, &quot;Nominal storage capacity&quot;: &quot;Номинальная ёмкость&quot;, &quot;Stored fuel&quot;: &quot;Топливо&quot;, &quot;Dispensing&quot;: &quot;Заправочная система&quot;, &quot;units /&quot;: &quot;ТРК /&quot;, &quot;nozzles&quot;: &quot;пистолетов&quot;, &quot;3D equipment illustration&quot;: &quot;Трёхмерная схема оборудования&quot;, &quot;Floor plan&quot;: &quot;План размещения&quot;, &quot;Equipment floor plan&quot;: &quot;План оборудования&quot;, &quot;Diesel compartment&quot;: &quot;Отсек дизельного топлива&quot;, &quot;Gasoline compartment&quot;: &quot;Отсек бензина&quot;, &quot;Dots: suppression material illustration&quot;: &quot;Точки: взрывоподавляющий материал&quot;, &quot;Engineering confirmation&quot;: &quot;Согласование с инженером&quot;, &quot;Print / Save as PDF&quot;: &quot;Печать / Сохранить PDF&quot;, &quot;Diesel&quot;: &quot;Дизель&quot;, &quot;Gasoline&quot;: &quot;Бензин&quot;, &quot;Gasoline + Diesel&quot;: &quot;Бензин + Дизель&quot;, &quot;Small&quot;: &quot;Малая модель&quot;, &quot;Medium&quot;: &quot;Средняя модель&quot;, &quot;Large&quot;: &quot;Большая модель&quot;, &quot;Containerized&quot;: &quot;Контейнерная модель&quot;, &quot;Tank&quot;: &quot;Резервуар&quot;, &quot;Storage tank&quot;: &quot;Резервуар&quot;, &quot;Office&quot;: &quot;Касса&quot;, &quot;Cashier room&quot;: &quot;Касса&quot;, &quot;Left bay&quot;: &quot;Левый отсек&quot;, &quot;Right bay&quot;: &quot;Правый отсек&quot;, &quot;Left end bay&quot;: &quot;Левый отсек&quot;, &quot;Right end bay&quot;: &quot;Правый отсек&quot;, &quot;Rear&quot;: &quot;Назад&quot;, &quot;Front&quot;: &quot;Вперёд&quot;, &quot;Left side&quot;: &quot;Слева&quot;, &quot;Right side&quot;: &quot;Справа&quot;, &quot;Front-facing&quot;: &quot;Лицевой стороной вперёд&quot;, &quot;Rear-facing&quot;: &quot;Лицевой стороной назад&quot;, &quot;No working bays&quot;: &quot;Без рабочих отсеков&quot;, &quot;One left bay and one right bay&quot;: &quot;По одному рабочему отсеку слева и справа&quot;, &quot;One right bay&quot;: &quot;Один рабочий отсек справа&quot;, &quot;Working bay positions to be confirmed&quot;: &quot;Расположение рабочих отсеков уточняется&quot;, &quot;Working bay positions pending&quot;: &quot;Расположение рабочих отсеков уточняется&quot;, &quot;Position to be confirmed&quot;: &quot;Расположение уточняется&quot;, &quot;Top view · Not to scale&quot;: &quot;Вид сверху · Не в масштабе&quot;, &quot;Dispenser detail model&quot;: &quot;Модель топливораздаточной колонки&quot;, &quot;Container enclosure 3D model&quot;: &quot;Трёхмерная модель контейнера&quot;};
    const ruText=value=&gt;russianLabels[value]||String(value).replace(/^No\. (\d+)$/, &#x27;№ $1&#x27;).replace(/^(\d+) bays · Positions pending$/, &#x27;$1 рабочих отсеков · Расположение уточняется&#x27;);
    const fuelRU={diesel:&#x27;Дизель&#x27;,petrol:&#x27;Бензин&#x27;,mixed:&#x27;Бензин + Дизель&#x27;};
    const reportLanguages=[&#x27;cn&#x27;,&#x27;en&#x27;,&#x27;ru&#x27;];
    function russianReady(){const texts=[state.canopy?state.canopyDetails:&#x27;&#x27;,state.office?state.officeDetails:&#x27;&#x27;,state.notes,state.voltage===&#x27;custom&#x27;&amp;&amp;hasChinese(englishVoltage(state.customVoltage))?state.customVoltage:&#x27;&#x27;];return !hasChinese(state.requirementsRU)&amp;&amp;(!texts.some(v=&gt;/[a-zA-Z\u3400-\u9fff]/.test(v))||!!state.requirementsRU.trim())}
    const reportReady=lang=&gt;lang===&#x27;cn&#x27;||(lang===&#x27;ru&#x27;?russianReady():englishReady());
    function russianDetail(value){const text=value.trim();if(!text)return &#x27;Уточняется&#x27;;if(/[a-zA-Z\u3400-\u9fff]/.test(text))return state.requirementsRU.trim()?&#x27;См. примечания на русском языке ниже&#x27;:&#x27;Требуется описание на русском языке&#x27;;return text}
    const russianConfirmation=&#x27;Предварительная комплектация. Полезный объём топлива, размеры оборудования, размещение отсеков, трубопроводы и электрические нагрузки необходимо согласовать с инженером. Схемы не в масштабе.&#x27;;
    function russianSections(){
      const small=state.family===&#x27;small&#x27;,box=state.family===&#x27;container&#x27;,t=totals(),use=nozzleUse(),row=(a,b)=&gt;[a,String(b)],yes=v=&gt;v?&#x27;Да&#x27;:&#x27;Нет&#x27;;
      const sections=[
        {title:&#x27;Резервуар и безопасность&#x27;,rows:[row(&#x27;Тип оборудования&#x27;,ruText(families[state.family].en)+(box?&#x27; · &#x27;+(state.capacity===30?&#x27;20ft&#x27;:&#x27;40ft&#x27;):&#x27;&#x27;)),row(small?&#x27;Конструкция резервуара&#x27;:&#x27;Внутренний резервуар&#x27;,small?&#x27;Одностенный прямоугольный резервуар, без отдельного внутреннего резервуара&#x27;:box?&#x27;Прямоугольный&#x27;:&#x27;Цилиндрический&#x27;),row(&#x27;Стенки резервуара&#x27;,small?&#x27;Одностенный&#x27;:&#x27;Двустенный&#x27;),row(&#x27;Взрывоподавляющий материал&#x27;,small?&#x27;Без заполнения&#x27;:&#x27;Заполнение ≥ 90%&#x27;)]},
        {title:&#x27;Топливо и отсеки&#x27;,rows:[row(&#x27;Номинальная ёмкость&#x27;,capacityText(state.capacity)),row(&#x27;Топливо&#x27;,fuelRU[state.fuel]),row(&#x27;Количество перегородок&#x27;,state.parts.length-1),row(&#x27;Количество отсеков резервуара&#x27;,state.parts.length),...state.parts.map((p,i)=&gt;row(compartmentName(i,&#x27;ru&#x27;),capacityText(p.volume)))]},
        {title:&#x27;Заправочная система&#x27;,rows:[row(&#x27;Рабочие отсеки&#x27;,state.bays.length),row(&#x27;Расположение рабочих отсеков&#x27;,ruText(bayLayout(&#x27;en&#x27;))),row(&#x27;Топливораздаточные колонки (ТРК)&#x27;,t.machines),row(&#x27;Заправочные пистолеты&#x27;,t.guns),row(&#x27;Пистолеты для дизельного топлива&#x27;,use.diesel),row(&#x27;Пистолеты для бензина&#x27;,use.petrol)]},
        {title:&#x27;Дополнительные опции&#x27;,rows:[row(&#x27;Навес&#x27;,yes(state.canopy)),row(&#x27;Офис (касса)&#x27;,yes(state.office)),row(&#x27;Логотип&#x27;,state.logo.trim()||&#x27;Не указан&#x27;),row(&#x27;Требования к навесу&#x27;,state.canopy?russianDetail(state.canopyDetails):&#x27;Не применяется&#x27;),row(&#x27;Требования к кассе&#x27;,state.office?russianDetail(state.officeDetails):&#x27;Не применяется&#x27;)]},
        {title:&#x27;Электроснабжение&#x27;,rows:[row(&#x27;Источник питания&#x27;,[state.mains?&#x27;Внешняя электросеть&#x27;:&#x27;&#x27;,state.solar?&#x27;Солнечная энергия&#x27;:&#x27;&#x27;,state.generator?&#x27;Генератор&#x27;:&#x27;&#x27;].filter(Boolean).join(&#x27; + &#x27;)),row(&#x27;Параметры электропитания&#x27;,state.voltage===&#x27;custom&#x27;?englishVoltage(state.customVoltage).replace(/3 phase/g,&#x27;3 фазы&#x27;).replace(/1 phase/g,&#x27;1 фаза&#x27;).replace(/To be confirmed/g,&#x27;Уточняется&#x27;):&#x27;Уточняется&#x27;)]},
        {title:&#x27;Дополнительные требования&#x27;,rows:[row(&#x27;Прочие требования&#x27;,state.notes.trim()?russianDetail(state.notes):&#x27;Нет&#x27;)]}
      ];
      if(state.requirementsRU.trim()&amp;&amp;!hasChinese(state.requirementsRU))sections[5].rows.push(row(&#x27;Примечания на русском языке&#x27;,state.requirementsRU.trim()));
      if(!small)state.bays.forEach((b,i)=&gt;{sections[2].rows.push(row(&#x27;Рабочий отсек &#x27;+(i+1)+&#x27; (&#x27;+ruText(bayPosition(i,&#x27;en&#x27;))+&#x27;)&#x27;,b.machines.length+&#x27; ТРК&#x27;));b.machines.forEach((m,j)=&gt;sections[2].rows.push(row(&#x27;ТРК &#x27;+(i+1)+&#x27;-&#x27;+(j+1),ruText(dispenserFacing(j,&#x27;en&#x27;))+&#x27;\n&#x27;+m.sources.map((n,k)=&gt;&#x27;Пистолет &#x27;+(k+1)+&#x27; → &#x27;+compartmentName(n,&#x27;ru&#x27;)).join(&#x27;\n&#x27;))))});
      if(small){sections[2].rows.push(row(&#x27;Расположение пистолетов&#x27;,&#x27;Два пистолета непосредственно на передней стороне резервуара&#x27;));newMachine().sources.forEach((n,k)=&gt;sections[2].rows.push(row(&#x27;Пистолет &#x27;+(k+1),compartmentName(n,&#x27;ru&#x27;))));}
